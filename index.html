<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>XOSHNAW MAP</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:
    Arial,
    "Noto Sans Arabic",
    sans-serif;
  background:#07111f;
}

#map{
  width:100%;
  height:100%;
}

/* =========================
   TOP BAR
========================= */

.topbar{
  position:fixed;
  top:12px;
  right:12px;
  left:12px;
  z-index:2000;

  height:58px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:7px 10px;

  background:rgba(8,18,32,.90);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);

  border:1px solid rgba(255,255,255,.10);
  border-radius:20px;

  box-shadow:
    0 10px 35px rgba(0,0,0,.35);
}

.logo{
  display:flex;
  align-items:center;
  gap:9px;

  font-size:19px;
  font-weight:900;
  letter-spacing:.5px;
}

.logoIcon{
  width:40px;
  height:40px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:13px;

  background:linear-gradient(
    135deg,
    #1687ff,
    #00c6ff
  );

  box-shadow:
    0 5px 20px rgba(0,160,255,.35);

  font-size:21px;
}

.refreshBtn{
  width:42px;
  height:42px;

  border:0;
  border-radius:13px;

  color:white;

  background:rgba(255,255,255,.10);

  font-size:21px;

  display:flex;
  align-items:center;
  justify-content:center;

  transition:.2s;
}

.refreshBtn:active{
  transform:rotate(180deg) scale(.92);
  background:#1687ff;
}

/* =========================
   SEARCH
========================= */

.searchBox{
  position:fixed;

  top:82px;
  right:12px;
  left:12px;

  z-index:1900;

  display:flex;
  gap:8px;
}

.searchInput{
  min-width:0;
  flex:1;

  height:52px;

  border:1px solid rgba(255,255,255,.10);
  border-radius:17px;

  outline:none;

  padding:0 17px;

  font-size:16px;
  color:white;

  background:rgba(8,18,32,.90);

  backdrop-filter:blur(15px);
  -webkit-backdrop-filter:blur(15px);

  box-shadow:
    0 8px 25px rgba(0,0,0,.25);
}

.searchInput::placeholder{
  color:#9ca9b8;
}

.searchBtn{
  width:58px;
  height:52px;

  border:0;
  border-radius:17px;

  color:white;

  background:
    linear-gradient(
      135deg,
      #1687ff,
      #00b8ff
    );

  font-size:21px;
  font-weight:bold;

  box-shadow:
    0 8px 25px rgba(0,140,255,.30);
}

.searchBtn:active{
  transform:scale(.94);
}

/* =========================
   NAVIGATION CARD
========================= */

.navigationCard{
  position:fixed;

  right:12px;
  left:12px;
  bottom:15px;

  z-index:1800;

  background:rgba(7,17,31,.94);

  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);

  border:1px solid rgba(255,255,255,.10);

  border-radius:24px;

  padding:15px;

  box-shadow:
    0 -10px 40px rgba(0,0,0,.35);
}

.stats{
  display:flex;
  gap:8px;
  margin-bottom:10px;
}

.stat{
  flex:1;

  background:rgba(255,255,255,.06);

  border-radius:15px;

  padding:9px;

  text-align:center;
}

.statTitle{
  color:#8997a8;
  font-size:12px;
  margin-bottom:3px;
}

.statValue{
  color:white;
  font-size:16px;
  font-weight:900;
}

.instruction{
  min-height:58px;

  display:flex;
  align-items:center;

  padding:12px 15px;

  border-radius:17px;

  background:
    linear-gradient(
      135deg,
      rgba(22,135,255,.20),
      rgba(0,198,255,.08)
    );

  border:1px solid rgba(0,174,255,.18);

  color:#fff;

  font-size:17px;
  font-weight:900;

  line-height:1.6;
}

.locationBtn{
  width:100%;

  height:48px;

  margin-top:9px;

  border:0;
  border-radius:15px;

  color:white;

  background:rgba(255,255,255,.08);

  font-size:15px;
  font-weight:bold;
}

.locationBtn:active{
  background:#1687ff;
  transform:scale(.98);
}

/* =========================
   PULL TO REFRESH
========================= */

.pullRefresh{
  position:fixed;

  top:-70px;
  left:50%;

  transform:translateX(-50%);

  z-index:3000;

  width:48px;
  height:48px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  background:rgba(8,18,32,.95);

  border:1px solid rgba(255,255,255,.15);

  box-shadow:
    0 8px 25px rgba(0,0,0,.35);

  color:white;

  font-size:22px;

  transition:top .15s ease;
}

.pullRefresh.show{
  top:12px;
}

.pullRefresh.rotate{
  animation:spin .7s linear infinite;
}

@keyframes spin{
  from{transform:translateX(-50%) rotate(0deg)}
  to{transform:translateX(-50%) rotate(360deg)}
}

/* =========================
   LEAFLET
========================= */

.leaflet-control-zoom{
  margin-top:155px !important;
  border:0 !important;
}

.leaflet-control-zoom a{
  background:#081220 !important;
  color:white !important;
  border:0 !important;
}

.leaflet-control-attribution{
  font-size:8px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:500px){

  .logo{
    font-size:17px;
  }

  .navigationCard{
    bottom:10px;
  }

  .instruction{
    font-size:16px;
  }

}

</style>
</head>

<body>

<!-- PULL REFRESH -->
<div id="pullRefresh" class="pullRefresh">
  🔄
</div>

<!-- TOP BAR -->
<div class="topbar">

  <div class="logo">
    <div class="logoIcon">🧭</div>
    XOSHNAW MAP
  </div>

  <button
    class="refreshBtn"
    onclick="refreshPage()">
    🔄
  </button>

</div>


<!-- SEARCH -->
<div class="searchBox">

  <input
    id="searchInput"
    class="searchInput"
    type="text"
    placeholder="شوێنێک بگەڕێ..."
    autocomplete="off">

  <button
    class="searchBtn"
    onclick="searchPlace()">
    🔍
  </button>

</div>


<!-- MAP -->
<div id="map"></div>


<!-- NAVIGATION CARD -->
<div class="navigationCard">

  <div class="stats">

    <div class="stat">

      <div class="statTitle">
        📍 دووری
      </div>

      <div
        id="distance"
        class="statValue">
        -
      </div>

    </div>

    <div class="stat">

      <div class="statTitle">
        ⏱️ کاتی گەیشتن
      </div>

      <div
        id="eta"
        class="statValue">
        -
      </div>

    </div>

  </div>


  <div
    id="instruction"
    class="instruction">

    🧭 شوێنێک بگەڕێ بۆ دەستپێکردنی ڕێگا

  </div>


  <button
    class="locationBtn"
    onclick="locateMe()">

    📍 شوێنی من

  </button>

</div>


<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

//////////////////////////////////////////////////////
// MAP
//////////////////////////////////////////////////////

const map =
L.map("map",{
  zoomControl:true
}).setView(
  [36.1911,44.0092],
  12
);


L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom:19,
    attribution:"© OpenStreetMap"
  }
).addTo(map);


//////////////////////////////////////////////////////
// VARIABLES
//////////////////////////////////////////////////////

let userLat = null;
let userLng = null;

let userMarker = null;
let destinationMarker = null;
let routeLine = null;

let routeSteps = [];

let currentStep = 0;
let lastVoiceStep = -1;

let destinationLat = null;
let destinationLng = null;

let arrived = false;

let voiceEnabled = false;


//////////////////////////////////////////////////////
// MP3
//////////////////////////////////////////////////////

const voices = {

  right:
    new Audio("right.mp3"),

  left:
    new Audio("left.mp3"),

  straight:
    new Audio("straight.mp3"),

  start:
    new Audio("start.mp3"),

  arrived:
    new Audio("arrived.mp3")

};


Object.values(voices).forEach(
  audio => {

    audio.preload = "auto";

  }
);


//////////////////////////////////////////////////////
// ENABLE AUDIO ON FIRST USER TOUCH
//////////////////////////////////////////////////////

document.addEventListener(
  "pointerdown",
  unlockAudio,
  {
    once:true
  }
);


function unlockAudio(){

  voiceEnabled = true;

  Object.values(voices).forEach(
    audio => {

      audio.muted = true;

      const p = audio.play();

      if(p){

        p.then(() => {

          audio.pause();
          audio.currentTime = 0;
          audio.muted = false;

        }).catch(() => {

          audio.muted = false;

        });

      }

    }
  );

}


//////////////////////////////////////////////////////
// PLAY VOICE
//////////////////////////////////////////////////////

function playVoice(name){

  if(!voiceEnabled){
    voiceEnabled = true;
  }

  const audio =
    voices[name];

  if(!audio){
    return;
  }

  Object.values(voices).forEach(
    a => {

      try{

        a.pause();
        a.currentTime = 0;

      }catch(e){}

    }
  );

  audio.currentTime = 0;

  audio.play().catch(
    error => {

      console.log(
        "Audio error:",
        error
      );

    }
  );

}


//////////////////////////////////////////////////////
// REFRESH
//////////////////////////////////////////////////////

function refreshPage(){

  location.reload();

}


//////////////////////////////////////////////////////
// GPS
//////////////////////////////////////////////////////

function locateMe(){

  if(!navigator.geolocation){

    alert(
      "GPS لەم وێبگەڕەدا بەردەست نییە"
    );

    return;
  }


  navigator.geolocation.getCurrentPosition(

    position => {

      userLat =
        position.coords.latitude;

      userLng =
        position.coords.longitude;

      updateUserMarker();

      map.setView(
        [userLat,userLng],
        16
      );

    },

    error => {

      console.log(error);

      alert(
        "تکایە ڕێگە بە GPS بدە"
      );

    },

    {
      enableHighAccuracy:true,
      timeout:15000,
      maximumAge:5000
    }

  );

}


//////////////////////////////////////////////////////
// USER MARKER
//////////////////////////////////////////////////////

function updateUserMarker(){

  if(
    userLat === null ||
    userLng === null
  ){
    return;
  }


  if(userMarker){

    userMarker.setLatLng(
      [userLat,userLng]
    );

  }else{

    userMarker =
      L.marker(
        [userLat,userLng]
      )
      .addTo(map)
      .bindPopup(
        "📍 شوێنی تۆ"
      );

  }

}


//////////////////////////////////////////////////////
// LIVE GPS
//////////////////////////////////////////////////////

if(navigator.geolocation){

  navigator.geolocation.watchPosition(

    position => {

      userLat =
        position.coords.latitude;

      userLng =
        position.coords.longitude;

      updateUserMarker();


      if(
        destinationLat !== null &&
        destinationLng !== null
      ){

        navigate();

      }

    },

    error => {

      console.log(
        "GPS:",
        error
      );

    },

    {
      enableHighAccuracy:true,
      maximumAge:3000,
      timeout:10000
    }

  );

}


//////////////////////////////////////////////////////
// SEARCH
//////////////////////////////////////////////////////

async function searchPlace(){

  unlockAudio();


  const input =
    document
    .getElementById("searchInput")
    .value
    .trim();


  if(!input){

    alert(
      "تکایە ناوی شوێنێک بنووسە"
    );

    return;
  }


  document
  .getElementById("instruction")
  .innerText =
  "🔎 بەدوای شوێنەکەدا دەگەڕێین...";


  try{

    const url =
      "https://nominatim.openstreetmap.org/search" +
      "?format=json" +
      "&q=" +
      encodeURIComponent(input) +
      "&limit=1";


    const response =
      await fetch(url);


    const data =
      await response.json();


    if(!data.length){

      document
      .getElementById("instruction")
      .innerText =
      "❌ شوێنەکە نەدۆزرایەوە";

      return;
    }


    destinationLat =
      parseFloat(data[0].lat);

    destinationLng =
      parseFloat(data[0].lon);


    if(destinationMarker){

      map.removeLayer(
        destinationMarker
      );

    }


    destinationMarker =
      L.marker([
        destinationLat,
        destinationLng
      ])
      .addTo(map)
      .bindPopup(
        "🎯 مەبەست"
      )
      .openPopup();


    arrived = false;
    currentStep = 0;
    lastVoiceStep = -1;


    await createRoute();


  }catch(error){

    console.log(error);

    document
    .getElementById("instruction")
    .innerText =
    "❌ هەڵەیەک ڕوویدا";

  }

}


//////////////////////////////////////////////////////
// CREATE ROUTE
//////////////////////////////////////////////////////

async function createRoute(){

  if(
    userLat === null ||
    userLng === null
  ){

    locateMe();

    document
    .getElementById("instruction")
    .innerText =
    "📍 چاوەڕێی شوێنی GPS ـە...";

    return;
  }


  const url =
    `https://router.project-osrm.org/route/v1/driving/` +
    `${userLng},${userLat};` +
    `${destinationLng},${destinationLat}` +
    `?overview=full&geometries=geojson&steps=true`;


  try{

    const response =
      await fetch(url);


    const data =
      await response.json();


    if(
      !data.routes ||
      !data.routes.length
    ){

      document
      .getElementById("instruction")
      .innerText =
      "❌ ڕێگای ئۆتۆمبێل نەدۆزرایەوە";

      return;
    }


    const route =
      data.routes[0];


    if(routeLine){

      map.removeLayer(
        routeLine
      );

    }


    routeLine =
      L.geoJSON(
        route.geometry,
        {
          style:{
            color:"#1687ff",
            weight:7,
            opacity:.9
          }
        }
      )
      .addTo(map);


    map.fitBounds(
      routeLine.getBounds(),
      {
        padding:[90,90]
      }
    );


    const distanceKm =
      route.distance / 1000;


    document
    .getElementById("distance")
    .innerText =
    distanceKm.toFixed(2)
    + " km";


    const minutes =
      Math.max(
        1,
        Math.ceil(
          route.duration / 60
        )
      );


    document
    .getElementById("eta")
    .innerText =
    minutes + " خولەک";


    routeSteps =
      route.legs[0].steps || [];


    currentStep = 0;
    lastVoiceStep = -1;
    arrived = false;


    document
    .getElementById("instruction")
    .innerText =
    "🚗 دەست بە ڕێگاکە دەکەین";


    // START VOICE
    setTimeout(
      () => {

        playVoice("start");

      },
      400
    );


  }catch(error){

    console.log(error);

    document
    .getElementById("instruction")
    .innerText =
    "❌ کێشە لە دروستکردنی ڕێگا";

  }

}


//////////////////////////////////////////////////////
// DISTANCE
//////////////////////////////////////////////////////

function distanceMeters(
  lat1,
  lon1,
  lat2,
  lon2
){

  const R = 6371000;


  const p1 =
    lat1 *
    Math.PI /
    180;


  const p2 =
    lat2 *
    Math.PI /
    180;


  const dLat =
    (lat2-lat1) *
    Math.PI /
    180;


  const dLon =
    (lon2-lon1) *
    Math.PI /
    180;


  const a =
    Math.sin(dLat/2) *
    Math.sin(dLat/2) +

    Math.cos(p1) *
    Math.cos(p2) *

    Math.sin(dLon/2) *
    Math.sin(dLon/2);


  const c =
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1-a)
    );


  return R*c;

}


//////////////////////////////////////////////////////
// NAVIGATION
//////////////////////////////////////////////////////

function navigate(){

  if(
    !routeSteps.length ||
    userLat === null ||
    userLng === null
  ){

    return;
  }


  //////////////////////////////////////////////////
  // ARRIVAL
  //////////////////////////////////////////////////

  const destinationDistance =
    distanceMeters(
      userLat,
      userLng,
      destinationLat,
      destinationLng
    );


  if(destinationDistance < 30){

    if(!arrived){

      arrived = true;


      document
      .getElementById("distance")
      .innerText =
      "0 m";


      document
      .getElementById("eta")
      .innerText =
      "گەیشتیت";


      document
      .getElementById("instruction")
      .innerText =
      "🏁 گەیشتیت بە مەبەست";


      playVoice("arrived");

    }

    return;

  }


  //////////////////////////////////////////////////
  // NEXT STEP
  //////////////////////////////////////////////////

  let bestStep = null;
  let bestDistance = Infinity;
  let bestIndex = currentStep;


  for(
    let i = currentStep;
    i < routeSteps.length;
    i++
  ){

    const step =
      routeSteps[i];


    if(
      !step.maneuver ||
      !step.maneuver.location
    ){

      continue;
    }


    const lng =
      step.maneuver.location[0];

    const lat =
      step.maneuver.location[1];


    const d =
      distanceMeters(
        userLat,
        userLng,
        lat,
        lng
      );


    if(d < bestDistance){

      bestDistance = d;
      bestStep = step;
      bestIndex = i;

    }

  }


  if(!bestStep){
    return;
  }


  currentStep =
    bestIndex;


  document
  .getElementById("distance")
  .innerText =
  Math.round(bestDistance)
  + " m";


  const type =
    bestStep.maneuver.type || "";


  const modifier =
    bestStep.maneuver.modifier || "";


  //////////////////////////////////////////////////
  // RIGHT
  //////////////////////////////////////////////////

  if(
    modifier === "right" ||
    modifier === "sharp right" ||
    modifier === "slight right"
  ){

    document
    .getElementById("instruction")
    .innerText =
    "➡️ بە دەستی ڕاست بسوڕێوە";


    if(
      bestDistance <= 50 &&
      lastVoiceStep !== bestIndex
    ){

      lastVoiceStep =
      bestIndex;

      playVoice("right");

    }

  }


  //////////////////////////////////////////////////
  // LEFT
  //////////////////////////////////////////////////

  else if(
    modifier === "left" ||
    modifier === "sharp left" ||
    modifier === "slight left"
  ){

    document
    .getElementById("instruction")
    .innerText =
    "⬅️ بە دەستی چەپ بسوڕێوە";


    if(
      bestDistance <= 50 &&
      lastVoiceStep !== bestIndex
    ){

      lastVoiceStep =
      bestIndex;

      playVoice("left");

    }

  }


  //////////////////////////////////////////////////
  // U TURN
  //////////////////////////////////////////////////

  else if(
    modifier === "uturn"
  ){

    document
    .getElementById("instruction")
    .innerText =
    "🔄 پاشگەز ببەوە";

  }


  //////////////////////////////////////////////////
  // ROUNDABOUT
  //////////////////////////////////////////////////

  else if(
    type === "roundabout"
  ){

    document
    .getElementById("instruction")
    .innerText =
    "🔄 بچۆ ناو بازنەکە";

  }


  //////////////////////////////////////////////////
  // STRAIGHT
  //////////////////////////////////////////////////

  else{

    document
    .getElementById("instruction")
    .innerText =
    "⬆️ بە ڕاستەوخۆ بەردەوام بە";


    if(
      bestDistance <= 50 &&
      lastVoiceStep !== bestIndex
    ){

      lastVoiceStep =
      bestIndex;

      playVoice("straight");

    }

  }

}


//////////////////////////////////////////////////////
// ENTER SEARCH
//////////////////////////////////////////////////////

document
.getElementById("searchInput")
.addEventListener(
  "keydown",
  event => {

    if(event.key === "Enter"){

      searchPlace();

    }

  }
);


//////////////////////////////////////////////////////
// PULL TO REFRESH
//////////////////////////////////////////////////////

let startY = 0;
let pulling = false;


document.addEventListener(
  "touchstart",
  event => {

    if(window.scrollY !== 0){
      return;
    }

    startY =
      event.touches[0].clientY;

    pulling = true;

  },
  {
    passive:true
  }
);


document.addEventListener(
  "touchmove",
  event => {

    if(!pulling){
      return;
    }


    const currentY =
      event.touches[0].clientY;


    const distance =
      currentY - startY;


    if(
      distance > 20 &&
      distance < 130
    ){

      const indicator =
        document.getElementById(
          "pullRefresh"
        );


      indicator.classList.add(
        "show"
      );


      if(distance > 75){

        indicator.style.top =
          "25px";

      }else{

        indicator.style.top =
          "-10px";

      }

    }

  },
  {
    passive:true
  }
);


document.addEventListener(
  "touchend",
  event => {

    if(!pulling){
      return;
    }


    pulling = false;


    const indicator =
      document.getElementById(
        "pullRefresh"
      );


    const currentY =
      event.changedTouches[0].clientY;


    const distance =
      currentY - startY;


    if(distance > 75){

      indicator.classList.add(
        "rotate"
      );


      indicator.style.top =
        "25px";


      setTimeout(
        () => {

          location.reload();

        },
        500
      );

    }else{

      indicator.classList.remove(
        "show"
      );

      indicator.style.top =
        "-70px";

    }

  },
  {
    passive:true
  }
);


//////////////////////////////////////////////////////
// START GPS
//////////////////////////////////////////////////////

locateMe();

</script>

</body>
</html>
