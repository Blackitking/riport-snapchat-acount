<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>XOSHNAW MAP</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#111;
  color:white;
}

#map{
  width:100%;
  height:100vh;
}

.panel{
  position:fixed;
  top:15px;
  right:15px;
  left:15px;
  z-index:1000;
  background:rgba(20,20,20,.94);
  padding:12px;
  border-radius:15px;
  box-shadow:0 5px 20px #000;
}

.search{
  display:flex;
  gap:8px;
}

.search input{
  flex:1;
  padding:13px;
  border:0;
  border-radius:10px;
  font-size:16px;
  outline:none;
}

button{
  border:0;
  border-radius:10px;
  padding:12px 15px;
  background:#1687ff;
  color:white;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

button:active{
  transform:scale(.97);
}

.info{
  margin-top:10px;
  background:#222;
  border-radius:10px;
  padding:10px;
  line-height:1.8;
}

#instruction{
  font-size:18px;
  font-weight:bold;
  color:#00d9ff;
}

.buttons{
  display:flex;
  gap:7px;
  margin-top:8px;
}

.buttons button{
  flex:1;
}

#voiceStatus{
  margin-top:8px;
  text-align:center;
  font-size:13px;
  color:#aaa;
}

.leaflet-control-attribution{
  font-size:9px;
}
</style>
</head>

<body>

<div id="map"></div>

<div class="panel">

  <div class="search">
    <input
      id="searchInput"
      type="text"
      placeholder="شوێن یان شار بنووسە..."
    >

    <button onclick="searchPlace()">گەڕان</button>
  </div>

  <div class="info">

    <div>
      📍 دووری:
      <b id="distance">-</b>
    </div>

    <div>
      ⏱️ کاتی گەیشتن:
      <b id="eta">-</b>
    </div>

    <div id="instruction">
      شوێنێک هەڵبژێرە
    </div>

  </div>

  <div class="buttons">

    <button onclick="locateMe()">
      📍 شوێنی من
    </button>

    <button onclick="enableVoice()">
      🔊 چالاککردنی دەنگ
    </button>

    <button onclick="testVoices()">
      🎵 تاقیکردنەوە
    </button>

  </div>

  <div id="voiceStatus">
    دەنگ چالاک نەکراوە
  </div>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

//////////////////////////////////////////////////////
// MAP
//////////////////////////////////////////////////////

const map = L.map("map").setView([36.1911,44.0092],12);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom:19,
    attribution:"© OpenStreetMap"
  }
).addTo(map);


//////////////////////////////////////////////////////
// VARIABLES
//////////////////////////////////////////////////////

let userLat = null;
let userLng = null;

let userMarker = null;
let destinationMarker = null;
let routeLine = null;

let routeSteps = [];
let currentStep = 0;

let destinationLat = null;
let destinationLng = null;

let arrived = false;

let voiceEnabled = false;

let lastVoiceStep = -1;


//////////////////////////////////////////////////////
// MP3 VOICES
//////////////////////////////////////////////////////

const voices = {

  right: new Audio("right.mp3"),

  left: new Audio("left.mp3"),

  straight: new Audio("straight.mp3"),

  start: new Audio("start.mp3"),

  arrived: new Audio("arrived.mp3")

};


// Preload
Object.values(voices).forEach(audio => {
  audio.preload = "auto";
});


//////////////////////////////////////////////////////
// PLAY VOICE
//////////////////////////////////////////////////////

function playVoice(name){

  if(!voiceEnabled){
    return;
  }

  const audio = voices[name];

  if(!audio){
    return;
  }

  // Stop every other sound
  Object.values(voices).forEach(a => {
    try{
      a.pause();
      a.currentTime = 0;
    }catch(e){}
  });

  audio.currentTime = 0;

  audio.play().catch(error => {

    console.log("Audio blocked:",error);

    document.getElementById("voiceStatus").innerText =
      "🔊 تکایە دووبارە دوگمەی چالاککردنی دەنگ دابگرە";

  });
}


//////////////////////////////////////////////////////
// ENABLE VOICE
//////////////////////////////////////////////////////

function enableVoice(){

  voiceEnabled = true;

  const status =
    document.getElementById("voiceStatus");

  status.innerText =
    "🔊 دەنگ چالاک کرا";

  // Browser audio unlock
  Object.values(voices).forEach(audio => {

    audio.muted = true;

    audio.play()
      .then(() => {

        audio.pause();
        audio.currentTime = 0;
        audio.muted = false;

      })
      .catch(() => {

        audio.muted = false;

      });

  });

}


//////////////////////////////////////////////////////
// TEST ALL VOICES
//////////////////////////////////////////////////////

function testVoices(){

  voiceEnabled = true;

  playVoice("start");

  setTimeout(() => {
    playVoice("right");
  },4000);

  setTimeout(() => {
    playVoice("left");
  },7000);

  setTimeout(() => {
    playVoice("straight");
  },9000);

  setTimeout(() => {
    playVoice("arrived");
  },11000);

}


//////////////////////////////////////////////////////
// GET USER LOCATION
//////////////////////////////////////////////////////

function locateMe(){

  if(!navigator.geolocation){

    alert("GPS لەم وێبگەڕەدا بەردەست نییە");

    return;
  }

  navigator.geolocation.getCurrentPosition(

    position => {

      userLat =
        position.coords.latitude;

      userLng =
        position.coords.longitude;

      updateUserMarker();

      map.setView(
        [userLat,userLng],
        16
      );

    },

    error => {

      alert(
        "نەتوانرا شوێنی تۆ دیاری بکرێت. تکایە GPS چالاک بکە."
      );

    },

    {
      enableHighAccuracy:true,
      timeout:15000,
      maximumAge:5000
    }

  );

}


//////////////////////////////////////////////////////
// UPDATE USER MARKER
//////////////////////////////////////////////////////

function updateUserMarker(){

  if(userLat === null || userLng === null){
    return;
  }

  if(userMarker){

    userMarker.setLatLng([
      userLat,
      userLng
    ]);

  }else{

    userMarker = L.marker([
      userLat,
      userLng
    ])
    .addTo(map)
    .bindPopup("📍 شوێنی تۆ");

  }

}


//////////////////////////////////////////////////////
// WATCH GPS
//////////////////////////////////////////////////////

if(navigator.geolocation){

  navigator.geolocation.watchPosition(

    position => {

      userLat =
        position.coords.latitude;

      userLng =
        position.coords.longitude;

      updateUserMarker();

      if(
        destinationLat !== null &&
        destinationLng !== null
      ){

        navigate();

      }

    },

    error => {

      console.log(
        "GPS error:",
        error
      );

    },

    {
      enableHighAccuracy:true,
      maximumAge:3000,
      timeout:10000
    }

  );

}


//////////////////////////////////////////////////////
// SEARCH PLACE
//////////////////////////////////////////////////////

async function searchPlace(){

  const input =
    document
      .getElementById("searchInput")
      .value
      .trim();

  if(!input){

    alert("تکایە ناوی شوێنێک بنووسە");

    return;
  }

  try{

    const url =
      "https://nominatim.openstreetmap.org/search" +
      "?format=json" +
      "&q=" +
      encodeURIComponent(input) +
      "&limit=1";

    const response =
      await fetch(url);

    const data =
      await response.json();

    if(!data.length){

      alert("شوێنەکە نەدۆزرایەوە");

      return;
    }

    destinationLat =
      parseFloat(data[0].lat);

    destinationLng =
      parseFloat(data[0].lon);

    if(destinationMarker){

      map.removeLayer(destinationMarker);

    }

    destinationMarker =
      L.marker([
        destinationLat,
        destinationLng
      ])
      .addTo(map)
      .bindPopup(
        "🎯 مەبەست<br>" +
        data[0].display_name
      )
      .openPopup();


    map.setView(
      [destinationLat,destinationLng],
      14
    );


    arrived = false;
    currentStep = 0;
    lastVoiceStep = -1;


    await createRoute();


  }catch(error){

    console.log(error);

    alert(
      "کێشەیەک لە گەڕاندا ڕوویدا"
    );

  }

}


//////////////////////////////////////////////////////
// CREATE ROUTE
//////////////////////////////////////////////////////

async function createRoute(){

  if(
    userLat === null ||
    userLng === null
  ){

    locateMe();

    alert(
      "سەرەتا ڕێگە بدە GPS شوێنی تۆ بدۆزێتەوە"
    );

    return;
  }


  const url =
    `https://router.project-osrm.org/route/v1/driving/` +
    `${userLng},${userLat};` +
    `${destinationLng},${destinationLat}` +
    `?overview=full&geometries=geojson&steps=true`;


  try{

    const response =
      await fetch(url);

    const data =
      await response.json();


    if(
      !data.routes ||
      !data.routes.length
    ){

      alert(
        "ڕێگای ئۆتۆمبێل نەدۆزرایەوە"
      );

      return;
    }


    const route =
      data.routes[0];


    //////////////////////////////////////////////////
    // REMOVE OLD ROUTE
    //////////////////////////////////////////////////

    if(routeLine){

      map.removeLayer(routeLine);

    }


    //////////////////////////////////////////////////
    // DRAW ROUTE
    //////////////////////////////////////////////////

    routeLine =
      L.geoJSON(
        route.geometry,
        {
          style:{
            color:"#1687ff",
            weight:7,
            opacity:.85
          }
        }
      )
      .addTo(map);


    map.fitBounds(
      routeLine.getBounds(),
      {
        padding:[70,70]
      }
    );


    //////////////////////////////////////////////////
    // DISTANCE
    //////////////////////////////////////////////////

    const distanceKm =
      route.distance / 1000;

    document
      .getElementById("distance")
      .innerText =
      distanceKm.toFixed(2) +
      " km";


    //////////////////////////////////////////////////
    // ETA
    //////////////////////////////////////////////////

    const minutes =
      Math.ceil(
        route.duration / 60
      );

    document
      .getElementById("eta")
      .innerText =
      minutes +
      " خولەک";


    //////////////////////////////////////////////////
    // STEPS
    //////////////////////////////////////////////////

    routeSteps =
      route.legs[0].steps || [];

    currentStep = 0;
    lastVoiceStep = -1;
    arrived = false;


    document
      .getElementById("instruction")
      .innerText =
      "🚗 دەست بە ڕێگاکە دەکەین";


    //////////////////////////////////////////////////
    // START VOICE
    //////////////////////////////////////////////////

    setTimeout(() => {

      playVoice("start");

    },500);


  }catch(error){

    console.log(error);

    alert(
      "کێشەیەک لە دروستکردنی ڕێگاکەدا ڕوویدا"
    );

  }

}


//////////////////////////////////////////////////////
// DISTANCE BETWEEN TWO GPS POINTS
//////////////////////////////////////////////////////

function distanceMeters(
  lat1,
  lon1,
  lat2,
  lon2
){

  const R = 6371000;

  const p1 =
    lat1 * Math.PI / 180;

  const p2 =
    lat2 * Math.PI / 180;

  const dLat =
    (lat2-lat1) *
    Math.PI / 180;

  const dLon =
    (lon2-lon1) *
    Math.PI / 180;


  const a =
    Math.sin(dLat/2) *
    Math.sin(dLat/2) +

    Math.cos(p1) *
    Math.cos(p2) *

    Math.sin(dLon/2) *
    Math.sin(dLon/2);


  const c =
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1-a)
    );


  return R*c;

}


//////////////////////////////////////////////////////
// NAVIGATION
//////////////////////////////////////////////////////

function navigate(){

  if(
    !routeSteps.length ||
    userLat === null ||
    userLng === null
  ){

    return;
  }


  //////////////////////////////////////////////////
  // ARRIVAL CHECK
  //////////////////////////////////////////////////

  const destinationDistance =
    distanceMeters(
      userLat,
      userLng,
      destinationLat,
      destinationLng
    );


  if(destinationDistance < 30){

    if(!arrived){

      arrived = true;

      document
        .getElementById("distance")
        .innerText =
        "0 m";

      document
        .getElementById("eta")
        .innerText =
        "گەیشتیت";

      document
        .getElementById("instruction")
        .innerText =
        "🏁 گەیشتیت بە مەبەست";

      playVoice("arrived");

    }

    return;
  }


  //////////////////////////////////////////////////
  // FIND NEXT MANEUVER
  //////////////////////////////////////////////////

  let bestStep = null;
  let bestDistance = Infinity;
  let bestIndex = currentStep;


  for(
    let i = currentStep;
    i < routeSteps.length;
    i++
  ){

    const step =
      routeSteps[i];


    if(
      !step.maneuver ||
      !step.maneuver.location
    ){

      continue;
    }


    const lng =
      step.maneuver.location[0];

    const lat =
      step.maneuver.location[1];


    const d =
      distanceMeters(
        userLat,
        userLng,
        lat,
        lng
      );


    if(d < bestDistance){

      bestDistance = d;

      bestStep = step;

      bestIndex = i;

    }

  }


  if(!bestStep){

    return;
  }


  currentStep = bestIndex;


  //////////////////////////////////////////////////
  // SHOW DISTANCE TO MANEUVER
  //////////////////////////////////////////////////

  document
    .getElementById("distance")
    .innerText =
    Math.round(bestDistance) +
    " m";


  //////////////////////////////////////////////////
  // MANEUVER TYPE
  //////////////////////////////////////////////////

  const type =
    bestStep.maneuver.type || "";

  const modifier =
    bestStep.maneuver.modifier || "";


  let instruction =
    "";


  //////////////////////////////////////////////////
  // RIGHT
  //////////////////////////////////////////////////

  if(
    modifier === "right" ||
    modifier === "sharp right" ||
    modifier === "slight right"
  ){

    instruction =
      "➡️ بە دەستی ڕاست بسوڕێوە";

    if(
      bestDistance <= 50 &&
      lastVoiceStep !== bestIndex
    ){

      lastVoiceStep =
        bestIndex;

      playVoice("right");

    }

  }


  //////////////////////////////////////////////////
  // LEFT
  //////////////////////////////////////////////////

  else if(
    modifier === "left" ||
    modifier === "sharp left" ||
    modifier === "slight left"
  ){

    instruction =
      "⬅️ بە دەستی چەپ بسوڕێوە";

    if(
      bestDistance <= 50 &&
      lastVoiceStep !== bestIndex
    ){

      lastVoiceStep =
        bestIndex;

      playVoice("left");

    }

  }


  //////////////////////////////////////////////////
  // U-TURN
  //////////////////////////////////////////////////

  else if(
    modifier === "uturn"
  ){

    instruction =
      "🔄 پاشگەز ببەوە";

    if(
      bestDistance <= 50 &&
      lastVoiceStep !== bestIndex
    ){

      lastVoiceStep =
        bestIndex;

      speakKurdish(
        "پاشگەز ببەوە"
      );

    }

  }


  //////////////////////////////////////////////////
  // ROUNDABOUT
  //////////////////////////////////////////////////

  else if(
    type === "roundabout"
  ){

    instruction =
      "🔄 بچۆ ناو بازنەکە";

    if(
      bestDistance <= 50 &&
      lastVoiceStep !== bestIndex
    ){

      lastVoiceStep =
        bestIndex;

      speakKurdish(
        "بچۆ ناو بازنەکە"
      );

    }

  }


  //////////////////////////////////////////////////
  // STRAIGHT
  //////////////////////////////////////////////////

  else{

    instruction =
      "⬆️ بە ڕاستەوخۆ بەردەوام بە";

    if(
      bestDistance <= 50 &&
      lastVoiceStep !== bestIndex
    ){

      lastVoiceStep =
        bestIndex;

      playVoice("straight");

    }

  }


  document
    .getElementById("instruction")
    .innerText =
    instruction;

}


//////////////////////////////////////////////////////
// BROWSER KURDISH SPEECH
//////////////////////////////////////////////////////

function speakKurdish(text){

  if(!voiceEnabled){
    return;
  }

  if(
    !("speechSynthesis" in window)
  ){

    return;
  }


  window.speechSynthesis.cancel();


  const speech =
    new SpeechSynthesisUtterance(text);

  speech.lang = "ku-IQ";

  speech.rate = .9;

  speech.pitch = 1;

  speech.volume = 1;


  window.speechSynthesis.speak(
    speech
  );

}


//////////////////////////////////////////////////////
// START GPS AUTOMATICALLY
//////////////////////////////////////////////////////

locateMe();


//////////////////////////////////////////////////////
// ENTER KEY SEARCH
//////////////////////////////////////////////////////

document
  .getElementById("searchInput")
  .addEventListener(
    "keydown",
    function(event){

      if(event.key === "Enter"){

        searchPlace();

      }

    }
  );

</script>

</body>
</html>
