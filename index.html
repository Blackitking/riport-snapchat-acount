<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>XOSHNAW MAP</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#eef2f5;
  overflow:hidden;
}

#map{
  width:100%;
  height:100vh;
}

/* Search */
.search-box{
  position:fixed;
  top:15px;
  left:50%;
  transform:translateX(-50%);
  width:92%;
  max-width:500px;
  z-index:1000;
  background:white;
  border-radius:16px;
  box-shadow:0 4px 20px rgba(0,0,0,.20);
  display:flex;
  align-items:center;
  padding:5px;
}

.search-box input{
  flex:1;
  border:0;
  outline:none;
  font-size:16px;
  padding:13px;
  direction:rtl;
}

.search-box button{
  border:0;
  background:#1769ff;
  color:white;
  border-radius:12px;
  padding:12px 16px;
  font-size:16px;
  cursor:pointer;
}

/* Buttons */
.controls{
  position:fixed;
  left:15px;
  bottom:100px;
  z-index:1000;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.control-btn{
  width:52px;
  height:52px;
  border:0;
  border-radius:50%;
  background:white;
  box-shadow:0 4px 15px rgba(0,0,0,.22);
  font-size:23px;
  cursor:pointer;
}

.control-btn:active{
  transform:scale(.94);
}

/* Bottom panel */
.bottom-panel{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  z-index:1000;
  background:white;
  border-radius:24px 24px 0 0;
  box-shadow:0 -4px 20px rgba(0,0,0,.18);
  padding:15px 18px 18px;
}

.brand{
  text-align:center;
  font-size:20px;
  font-weight:bold;
  color:#1769ff;
  margin-bottom:10px;
}

.status{
  text-align:center;
  color:#555;
  font-size:14px;
}

.route-btn{
  width:100%;
  margin-top:12px;
  padding:14px;
  border:0;
  border-radius:14px;
  background:#1769ff;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.route-btn:active{
  transform:scale(.98);
}

.leaflet-control-attribution{
  font-size:9px;
}
</style>
</head>

<body>

<div id="map"></div>

<!-- Search -->
<div class="search-box">
  <input
    id="searchInput"
    type="text"
    placeholder="گەڕان بۆ شوێن..."
  >
  <button onclick="searchPlace()">گەڕان</button>
</div>

<!-- Map controls -->
<div class="controls">
  <button class="control-btn" onclick="findMe()">📍</button>
  <button class="control-btn" onclick="zoomIn()">＋</button>
  <button class="control-btn" onclick="zoomOut()">−</button>
</div>

<!-- Bottom -->
<div class="bottom-panel">
  <div class="brand">XOSHNAW MAP</div>

  <div id="status" class="status">
    دوگمەی 📍 دابگرە بۆ دۆزینەوەی شوێنی تۆ
  </div>

  <button class="route-btn" onclick="findMe()">
    📍 شوێنی من بدۆزەوە
  </button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================
   Map
========================= */

const map = L.map("map").setView([36.1911,44.0092], 13);

/* OpenStreetMap */

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom:19,
    attribution:"© OpenStreetMap contributors"
  }
).addTo(map);


/* =========================
   Variables
========================= */

let userMarker = null;
let accuracyCircle = null;


/* =========================
   Find User
========================= */

function findMe(){

  const status = document.getElementById("status");

  if(!navigator.geolocation){
    status.innerText = "ئەم ئامێرە GPS پشتگیری ناکات.";
    return;
  }

  status.innerText = "لە دۆزینەوەی شوێنی تۆدایە...";

  navigator.geolocation.getCurrentPosition(

    function(position){

      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      const accuracy = position.coords.accuracy;

      if(userMarker){
        map.removeLayer(userMarker);
      }

      if(accuracyCircle){
        map.removeLayer(accuracyCircle);
      }

      /* User marker */

      userMarker = L.marker([lat,lng])
        .addTo(map)
        .bindPopup("📍 شوێنی تۆ")
        .openPopup();

      /* Accuracy */

      accuracyCircle = L.circle(
        [lat,lng],
        {
          radius:accuracy,
          color:"#1769ff",
          fillColor:"#1769ff",
          fillOpacity:.15
        }
      ).addTo(map);

      map.setView([lat,lng],16);

      status.innerText =
        "شوێنی تۆ دۆزرایەوە 📍";

    },

    function(error){

      if(error.code === 1){
        status.innerText =
          "تکایە مۆڵەتی Location/GPS بدە بە وێبگەکە.";
      }
      else if(error.code === 2){
        status.innerText =
          "شوێنی GPS بەردەست نییە.";
      }
      else{
        status.innerText =
          "کێشەیەک لە دۆزینەوەی شوێن ڕوویدا.";
      }

    },

    {
      enableHighAccuracy:true,
      timeout:10000,
      maximumAge:0
    }

  );
}


/* =========================
   Zoom
========================= */

function zoomIn(){
  map.zoomIn();
}

function zoomOut(){
  map.zoomOut();
}


/* =========================
   Search Place
========================= */

async function searchPlace(){

  const input =
    document.getElementById("searchInput");

  const query = input.value.trim();

  if(!query){
    return;
  }

  const status =
    document.getElementById("status");

  status.innerText =
    "لە گەڕان بەدوای شوێنەکەدایە...";

  try{

    const url =
      "https://nominatim.openstreetmap.org/search" +
      "?format=json" +
      "&limit=1" +
      "&q=" +
      encodeURIComponent(query);

    const response =
      await fetch(url,{
        headers:{
          "Accept-Language":"ku,en"
        }
      });

    const data =
      await response.json();

    if(!data.length){

      status.innerText =
        "شوێنەکە نەدۆزرایەوە.";

      return;
    }

    const place = data[0];

    const lat =
      parseFloat(place.lat);

    const lon =
      parseFloat(place.lon);

    map.setView([lat,lon],16);

    L.marker([lat,lon])
      .addTo(map)
      .bindPopup(
        "📍 " + place.display_name
      )
      .openPopup();

    status.innerText =
      "شوێنەکە دۆزرایەوە 📍";

  }
  catch(error){

    status.innerText =
      "کێشەیەک لە گەڕان ڕوویدا.";

  }

}


/* =========================
   Enter Search
========================= */

document
  .getElementById("searchInput")
  .addEventListener(
    "keydown",
    function(event){

      if(event.key === "Enter"){
        searchPlace();
      }

    }
  );

</script>

</body>
</html>
